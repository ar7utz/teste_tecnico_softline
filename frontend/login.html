<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Softline</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-blue-700 mb-6 text-center">Softline</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600 mb-1">Usuário</label>
      <input id="login" type="text" autofocus
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Digite seu usuário" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600 mb-1">Senha</label>
      <input id="senha" type="password"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Digite sua senha" />
    </div>

    <p id="erro" class="hidden text-red-500 text-sm mb-3"></p>

    <button onclick="fazerLogin()"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">
      Entrar
    </button>

    <p class="text-xs text-gray-400 text-center mt-4">
      Primeiro acesso? Crie seu usuário via
      <span class="font-mono">POST /User/FirstAuth</span> no Swagger.
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
