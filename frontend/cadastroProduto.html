<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produto - Softline</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div id="navbar"></div>

  <div class="max-w-2xl mx-auto mt-8 px-4">
    <div class="bg-white rounded shadow p-6">
      <h1 id="titulo-form" class="text-2xl font-bold text-gray-700 mb-6">Novo Produto</h1>

      <div class="grid grid-cols-1 gap-4">

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Código</label>
          <input id="codigo" type="number" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Código do produto" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Descrição</label>
          <input id="descricao" type="text" maxlength="60" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Descrição (máx. 60 caracteres)" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Código de Barras</label>
          <input id="codigoBarras" type="text" maxlength="14" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Cód. barras (máx. 14 caracteres)" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Valor de Venda</label>
          <input id="valorVenda" type="number" step="0.01" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="0,00" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Peso Bruto</label>
            <input id="pesoBruto" type="number" step="0.001" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="0,000" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Peso Líquido</label>
            <input id="pesoLiquido" type="number" step="0.001" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="0,000" />
          </div>
        </div>

      </div>

      <div id="botoes" class="flex gap-3 mt-6">
        <button onclick="salvar()" id="btn-salvar" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
          Salvar
        </button>
        <button onclick="voltar()" class="bg-gray-400 text-white px-6 py-2 rounded hover:bg-gray-500">
          Voltar
        </button>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/produto-form.js"></script>
  <script>carregarNavbar();</script>

</body>
</html>
